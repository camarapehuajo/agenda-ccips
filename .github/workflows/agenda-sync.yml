name: Actualizar agenda desde Notion

on:
  # Corre automáticamente cada 15 minutos
  schedule:
    - cron: "*/15 * * * *"
  # Permite ejecutarlo a mano desde la pestaña "Actions"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sincronizar con Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: "3fc854fe-4e5d-81a1-ad13-ca69cf62f675"
        run: node scripts/sync-notion.js

      - name: Guardar cambios (si hay)
        run: |
          git config user.name "Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add actividades.js agenda.ics
          if [ -d img ]; then git add img; fi
          if git diff --cached --quiet; then
            echo "Sin cambios para subir."
          else
            git commit -m "Actualizar agenda desde Notion"
            git push
          fi
