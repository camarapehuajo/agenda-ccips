name: Bot de Telegram (cargar actividades)

on:
  # Revisa mensajes nuevos del bot cada 10 minutos
  schedule:
    - cron: "*/10 * * * *"
  # Permite ejecutarlo a mano desde "Actions"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-bot
      cancel-in-progress: false
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Procesar mensajes del bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_TELEGRAM_IDS: ${{ secrets.ALLOWED_TELEGRAM_IDS }}
        run: node scripts/telegram-bot.js

      - name: Guardar borradores pendientes (si hay cambios)
        run: |
          git config user.name "Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f pendientes.json ]; then git add pendientes.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Bot: actualizar borradores pendientes"
            git push
          fi
